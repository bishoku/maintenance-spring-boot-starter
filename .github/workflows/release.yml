name: Release to Maven Central

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag version, without v (e.g. 1.2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected X.Y.Z'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Check POM and release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          version = os.environ['RELEASE_VERSION']
          actual = ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text
          assert actual == version, f'POM {actual} does not match tag {version}'
          assert pathlib.Path(f'release-notes/v{version}.md').read_text().strip(), 'Release notes required'
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Configure GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Test, sign and publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          mvn --batch-mode --no-transfer-progress clean deploy -P release
          -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"
          --settings .github/settings.xml

      - name: Collect published artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release-assets
          BASE="maintenance-spring-boot-starter-$RELEASE_VERSION"
          for FILE in "$BASE.jar" "$BASE-sources.jar" "$BASE-javadoc.jar"; do
            cp "target/$FILE" "target/$FILE.asc" release-assets/
          done
          cp pom.xml "release-assets/$BASE.pom"
          cp target/*.pom.asc "release-assets/$BASE.pom.asc"
          cd release-assets
          sha256sum ./*.jar ./*.pom ./*.asc > SHA256SUMS

      - name: Preserve artifacts for GitHub release and recovery
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.publish.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.publish.outputs.version }}
          path: release-assets
      - name: Publish GitHub release with notes and binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          (cd release-assets && sha256sum --check SHA256SUMS)
          NOTES="release-notes/$RELEASE_TAG.md"
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Release already published; do not replace its assets"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --title "$RELEASE_TAG" --notes-file "$NOTES"
