server.address=127.0.0.1
server.port=18080
management.endpoints.web.exposure.include=health,maintenance,metrics
management.endpoint.maintenance.access=unrestricted
management.endpoint.health.probes.enabled=true
spring.kafka.bootstrap-servers=127.0.0.1:29092
spring.kafka.consumer.group-id=maintenance-benchmark
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=25673
spring.rabbitmq.username=benchmark
spring.rabbitmq.password=benchmark-local-only
spring.rabbitmq.listener.simple.prefetch=1
maintenance.drain-delay=0s
maintenance.hook-timeout=300ms
maintenance.queue-timeout=5s

spring.kafka.listener.poll-timeout=100ms
